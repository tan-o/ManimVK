name: Tests and example scenes

# Builds the native modules, runs the test suite, renders a movie through the
# video path and renders every example scene (tools/scenes).  GitHub's runners
# have no GPU: Mesa's lavapipe provides Vulkan in software, so the real Skia
# Ganesh Vulkan path runs, only slower.

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Regex on scene ids (empty renders all)"
        required: false
        default: ""
  push:
    branches:
      - master
      - rust-core-preview

concurrency:
  group: scenes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scenes:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      PYTHONIOENCODING: "utf8"
      ONLY: ${{ github.event.inputs.only }}

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Use crates.io directly
        # .cargo/config.toml points at a mirror for local builds in China.
        run: rm -f .cargo/config.toml

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native/manim_core
            native/manim_vk

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango1.0-dev libcairo2-dev pkg-config \
            mesa-vulkan-drivers libvulkan1 vulkan-tools \
            clang ninja-build fonts-dejavu-core

      - name: Install TeX Live
        uses: zauguin/install-texlive@v4
        with:
          packages: >
            scheme-basic latex fontspec tipa calligra xcolor
            standalone preview doublestroke setspace rsfs relsize
            ragged2e fundus-calligra microtype wasysym physics dvisvgm jknapltx
            wasy cm-super babel-english gnu-freefont mathastext cbfonts-fd xetex
            esvect frcursive ctex fandol xecjk zhnumber

      - name: Select lavapipe
        run: |
          icd=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n 1)
          echo "lavapipe ICD: $icd"
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"

      - name: Show the Vulkan device
        # Diagnostics only: vulkaninfo can fail on its window-system queries
        # on a headless runner while offscreen Vulkan works.
        continue-on-error: true
        run: vulkaninfo --summary

      - name: Install manim and the native modules
        run: |
          # typst: TypstMobject examples; dev: test and example dependencies.
          uv pip install --system -e ".[typst]" --group dev
          uv pip install --system ./native/manim_core ./native/manim_vk
          python -c "import manim_vk, manim_core; print('native modules import')"

      - name: Run the tests
        env:
          # Graphical unit comparisons with ManimCE's Cairo control frames,
          # per frame, with images of those that differ in places.
          MANIM_FRAME_REPORT: scenes/frame_report
        run: python -m pytest tests -q -o addopts="" -p no:cacheprovider

      - name: Render a movie
        if: ${{ !cancelled() }}
        # Golden compares PNG frames; this covers the video path (GPU YUV
        # readback and the encoder).
        run: |
          manim render -ql --media_dir media example_scenes/basic.py SquareToCircle
          python - <<'EOF'
          import glob, av
          path = glob.glob("media/videos/**/SquareToCircle.mp4", recursive=True)[0]
          container = av.open(path)
          stream = container.streams.video[0]
          frames = sum(1 for _ in container.decode(video=0))
          context = stream.codec_context
          print(path, frames, "frames, colour tags",
                context.colorspace, context.color_primaries, context.color_trc, context.color_range)
          assert frames > 0
          EOF

      - name: Render the example scenes
        if: ${{ !cancelled() }}
        run: |
          python tools/scenes/collect.py --out scenes
          status=0
          python tools/scenes/render.py --scenes scenes --jobs 2 ${ONLY:+--only "$ONLY"} || status=$?
          cat scenes/report.md >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Draw hairy ball frames
        if: ${{ !cancelled() }}
        run: python tools/scenes/hairy_frames.py --out scenes/hairy --size 854x480 --print-jpeg

      - name: Summarise the Cairo comparisons
        if: ${{ !cancelled() }}
        # The largest per-block differences from ManimCE's control frames,
        # and the images of those over 24 levels as base64 JPEG lines.
        run: |
          python - <<'EOF'
          import base64, io, json, pathlib
          from PIL import Image
          folder = pathlib.Path("scenes/frame_report")
          rows = [json.loads(line) for line in (folder / "report.jsonl").read_text().splitlines()]
          worst = {}
          for row in rows:
              if row["max_block"] > worst.get(row["name"], {"max_block": -1})["max_block"]:
                  worst[row["name"]] = row
          ranked = sorted(worst.values(), key=lambda row: -row["max_block"])
          print(len(rows), "frames compared,", len(worst), "tests")
          for row in ranked[:60]:
              print(json.dumps(row))
          for path in sorted(folder.glob("*.png"))[:40]:
              buffer = io.BytesIO()
              Image.open(path).convert("RGB").save(buffer, format="JPEG", quality=80)
              print("JPEG", path.name, base64.b64encode(buffer.getvalue()).decode())
          EOF

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scenes-report
          path: |
            scenes/report.md
            scenes/frames/*/final.png
            scenes/hairy/*.png
            scenes/frame_report/*
            media/videos
          if-no-files-found: warn
